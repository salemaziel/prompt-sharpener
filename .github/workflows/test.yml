name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hook:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install jq if missing
        run: command -v jq || { if command -v brew >/dev/null; then brew install jq; else sudo apt-get install -y jq; fi; }
      # macOS ships bash 3.2 as /bin/bash with BSD awk, tr and find: the oldest setup the
      # hook has to survive. Linux runs the current GNU tools.
      - name: Use /bin/bash for every bash call
        run: mkdir -p "$RUNNER_TEMP/b" && ln -sf /bin/bash "$RUNNER_TEMP/b/bash" && echo "$RUNNER_TEMP/b" >>"$GITHUB_PATH"
      # On macOS, a UTF-8 locale as on a user's Mac: BSD tr then counts characters, not
      # bytes, which is what the hook's byte-wise word check has to survive.
      - name: Hook tests
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8; fi
          bash --version | head -1 && bash tests/test-hook.sh
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning hooks/sharpen.sh
